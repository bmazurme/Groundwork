services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: groundwork
      MINIO_ROOT_PASSWORD: groundwork-secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      FRONTEND_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://groundwork:groundwork@postgres:5432/groundwork
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: groundwork-documents
      S3_ACCESS_KEY_ID: groundwork
      S3_SECRET_ACCESS_KEY: groundwork-secret
      S3_FORCE_PATH_STYLE: "true"
      EMBEDDINGS_PROVIDER: onnx
      TRANSFORMERS_CACHE_DIR: /model-cache
    volumes:
      - .:/app
      - /app/node_modules
      - onnx-model-cache:/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: npm run start:dev -w backend

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:3001
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -w frontend

volumes:
  postgres-data:
  minio-data:
  onnx-model-cache:
